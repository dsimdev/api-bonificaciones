server:
  port: ${PORT:8080}

spring:
  application:
    name: api-bonificaciones

bonificaciones:
  # Lo reemplaza el build al empaquetar (ver processResources en bonif-app/build.gradle.kts), para
  # que /health informe la version que realmente esta corriendo y no una escrita a mano.
  version: "@version@"

  # Una entrada por distribuidora (tenant), con una seccion por fuente. Una distribuidora puede
  # tener varias: los criterios salen de GESCOM, los atributos de cliente/articulo pueden salir
  # del gateway de Axum. La seccion que no esta, no se consulta -- y /health lo muestra.
  #
  # Las credenciales llegan por variable de entorno: nunca se commitean. Para correr local,
  # copiar .env.example y completarlo (ver docs/proyecto/entorno-local.md).
  distribuidoras:
    dyssa:
      gescom:
        host: https://dyssa.gescom.online
        realm: gcw-dyssa
        usuario: ${DYSSA_GESCOM_USER:}
        clave: ${DYSSA_GESCOM_PASS:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
